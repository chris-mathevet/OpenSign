<VirtualHost *:443>
    ServerName {OPENSIGN_HOST_URL}

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RewriteEngine On

    RewriteRule ^/api/(.*)$ http://127.0.0.1:{OPENSIGN_PORT}/$1 [P,L]

    RewriteRule ^/app/(.*)$ http://127.0.0.1:{OPENSIGN_PORT}/$1 [P,L]

    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/app/
    RewriteRule ^/(.*)$ http://127.0.0.1:{CLIENT_PORT}/$1 [P,L]

    # <Location />
    #     Require ip 173.209.40.91
    #     Require ip 50.21.20.252
    #     Require all denied
    # </Location>
</VirtualHost>
